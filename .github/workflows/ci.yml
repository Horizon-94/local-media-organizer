name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/public_release_audit.py .
      - run: python -m compileall -q apps scripts
      - run: >-
          python -m pytest -q
          tests/test_public_release_audit.py
          tests/test_release_distribution_v1.py
          tests/test_media_archive_search_readiness_v1.py
          tests/test_media_archive_repository_schema_compat_v1.py
          tests/test_media_archive_native_bridge_state_v1.py
          tests/test_media_archive_image_video_native_app_v1.py
          tests/test_media_archive_pipeline_orchestrator_v1.py
          tests/test_media_archive_generic_sampling_density_v1.py
      - name: 1.2.6 hotfix9 maintenance regression (synthetic data only)
        run: >-
          python -m pytest -q
          tests/test_v126_editorial_layout.py
          tests/test_v126_light_selection_rows.py
          tests/test_v126_search_modes.py
          tests/test_v126_search_ui_performance.py
          tests/test_v126_search_to_editorial.py
          tests/test_v126_ui_hotfix2.py
          tests/test_v125_editorial_session.py
          tests/test_v125_editorial_favorites.py
          tests/test_v125_editorial_trim.py
          tests/test_v125_editorial_preview.py
      - name: 1.2.7 cross-library search regression (synthetic data only)
        run: >-
          python -m pytest -q
          tests/test_v127_cross_library_search.py
          tests/test_v126_search_visual_policy.py
          tests/test_v127_portable_packaging.py
