name: Bug 报告
description: 报告可复现的软件问题（请勿提交私人素材或数据库）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢反馈。请删除用户名、素材路径、数据库内容、令牌和模型文件。"
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "例如 1.1.4，以及 Release SHA-256"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与芯片
      placeholder: "例如 macOS 15 / Apple M2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 使用合成文件名和通用路径，不要上传真实素材。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与最短错误片段
      description: 只贴必要片段，并先移除个人路径和令牌。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有附加真实数据库、素材、模型权重、令牌或私人绝对路径。
          required: true
